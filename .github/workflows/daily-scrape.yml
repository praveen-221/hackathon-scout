name: Daily Hackathon Scout

on:
  schedule:
    # Run daily at 00:00 UTC (midnight)
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:
  # Also run on push to main
  push:
    branches:
      - main

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Hackathon Scout
        env:
          SMTP_PASSWD: ${{ secrets.SMTP_PASSWD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_LIST: ${{ secrets.RECIPIENT_LIST }}
        run: |
          python -m src.cli
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hackathon-data
          path: |
            data/
            logs/
          retention-days: 7
      
      - name: Summary
        if: always()
        run: |
          echo "## Hackathon Scout Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f data/hackathons.json ]; then
            total=$(python -c "import json; print(len(json.load(open('data/hackathons.json'))))")
            echo "Total hackathons in storage: **$total**" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Last run: $(date)" >> $GITHUB_STEP_SUMMARY